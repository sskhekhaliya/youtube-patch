name: Auto-Patch YouTube

on:
  schedule:
    # Runs automatically every Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if this version is already released'
        required: false
        type: boolean
        default: false
      target_version:
        description: 'Specific YouTube version (leave empty to auto-detect latest compatible)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Patch YouTube APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Auto-Patcher Engine
        id: build
        run: |
          ARGS=""
          if [ "${{ inputs.force_build }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.target_version }}" ]; then
            ARGS="$ARGS --target-version ${{ inputs.target_version }}"
          fi
          python scripts/builder.py $ARGS

      - name: Publish GitHub Release
        if: steps.build.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag_name }}
          name: YouTube ReVanced ${{ steps.build.outputs.tag_name }}
          body_path: ${{ steps.build.outputs.release_notes }}
          files: ${{ steps.build.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
